name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      # no concrete-python here, so the fhe tests skip themselves
      - run: uv run pytest -q

  fhe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t cipherforest .
      - run: docker run --rm cipherforest pytest -q -m fhe
