name: release

# Pushing a tag such as v0.3.0 builds the wheel and sdist, checks that the tag
# matches the version in pyproject.toml, and uploads both to PyPI. The upload
# uses PyPI trusted publishing (no token in the repo): the PyPI project must list
# this repository, this workflow file and the "pypi" environment as a publisher.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv build
      - run: uv venv /tmp/pkg && uv pip install --python /tmp/pkg/bin/python dist/*.whl
      - run: /tmp/pkg/bin/cipherforest --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
