[project]
name = "cipherforest"
version = "0.2.0"
description = "Encrypted tree inference with exact SHAP explanations over TFHE"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ekin Doğu Boztepe" }]
keywords = ["fully homomorphic encryption", "TFHE", "SHAP", "explainability", "privacy", "decision trees", "CatBoost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<2.0"]

[project.urls]
Repository = "https://github.com/ekinboztepe/cipherforest"

[project.optional-dependencies]
# Concrete has no Windows wheels; use docker/Dockerfile there
# Concrete 2.11 imports pkg_resources, which fresh environments (uv) do not have
fhe = ["concrete-python==2.11.0; sys_platform != 'win32'", "setuptools<81; sys_platform != 'win32'"]
catboost = ["catboost>=1.2"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]
experiments = ["scikit-learn>=1.4", "catboost>=1.2", "shap>=0.46", "pandas>=2.1"]

[tool.uv]
default-groups = ["dev", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipherforest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fhe: needs concrete-python"]

[tool.ruff]
line-length = 120
